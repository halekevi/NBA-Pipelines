<script>
(function(){
  // Skip cosmetic DOM passes on coarse-pointer (touch) devices.
  const isCoarse = window.matchMedia('(pointer: coarse)').matches;
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!isCoarse && !reduceMotion) {
    const CA_SELS = [
      '.tickets-built .ticket', '.tickets-built .hero',
      '.tickets-built .filter-pill', '.tickets-built .kpi'
    ];
    function initCA() {
      CA_SELS.forEach(sel =>
        document.querySelectorAll(sel).forEach(el => {
          el.classList.add('ca-border');
        })
      );
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initCA);
    } else {
      initCA();
    }
    let queued = false;
    const queueInit = () => {
      if (queued) return;
      queued = true;
      requestAnimationFrame(() => {
        queued = false;
        initCA();
      });
    };
    const obs = new MutationObserver(queueInit);
    obs.observe(document.body, { childList: true, subtree: true });
  }
})();
</script>
<script>
(function () {
  const legTables = document.querySelectorAll('.ticket-legs-table-wrapper');
  if (!legTables.length || !('IntersectionObserver' in window)) return;

  const legObs = new IntersectionObserver((entries) => {
    entries.forEach((entry) => {
      if (entry.isIntersecting) {
        entry.target.style.contentVisibility = 'visible';
        legObs.unobserve(entry.target);
      }
    });
  }, { rootMargin: '200px' });

  legTables.forEach((node) => {
    node.style.contentVisibility = 'auto';
    legObs.observe(node);
  });
})();
</script>

<script>
(function () {
  const _origFetch = window.fetch.bind(window);
  window.fetch = function (input, init) {
    const urlStr = (typeof input === 'string') ? input : (input && input.url ? input.url : String(input || ''));
    const path = urlStr.replace(window.location.origin, '');
    if (path.includes('/api/uniform-tickets/dates')) {
      return _origFetch('uniform_tickets_dates.json', init);
    }
    if (path.includes('/api/uniform-tickets/backtest')) {
      return _origFetch('uniform_tickets_backtest.json', init);
    }
    if (path.includes('/api/uniform-tickets/latest')) {
      return _origFetch('uniform_tickets_latest.json', init);
    }
    const m = path.match(/\/api\/uniform-tickets\/(\d{4}-\d{2}-\d{2})$/);
    if (m) {
      return _origFetch(`uniform_tickets_${m[1]}.json`, init);
    }
    return _origFetch(input, init);
  };
})();
</script>
