{# Shared Payouts secondary nav. Highlight via body class:
   page-payout (+ data-payout-tab), page-payout-log, page-payout-ladder #}
<style>
  .payout-subnav {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 10px;
    margin: 0 0 14px;
    padding: 10px 12px;
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 12px;
    background: rgba(255,255,255,.03);
  }
  .payout-subnav-back {
    display: none;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    border-radius: 999px;
    border: 1px solid rgba(212,175,55,.35);
    background: rgba(212,175,55,.1);
    color: var(--accent, #d4af37);
    text-decoration: none;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .04em;
    white-space: nowrap;
  }
  .page-payout-ladder .payout-subnav-back { display: inline-flex; }
  .payout-subnav-back:hover { background: rgba(212,175,55,.18); }
  .payout-subnav-sep {
    display: none;
    width: 1px;
    height: 22px;
    background: rgba(255,255,255,.12);
    flex-shrink: 0;
  }
  .page-payout-ladder .payout-subnav-sep { display: block; }
  .payout-subnav-links {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
    flex: 1;
  }
  .payout-subnav-links a {
    text-decoration: none;
    color: rgba(255,255,255,.72);
    font-size: 11px;
    letter-spacing: .06em;
    text-transform: uppercase;
    padding: 6px 10px;
    border-radius: 999px;
    border: 1px solid transparent;
  }
  .payout-subnav-links a:hover {
    color: rgba(255,255,255,.95);
    background: rgba(255,255,255,.04);
  }
  .payout-subnav-links a.active,
  .page-payout:not([data-payout-tab="cards"]) .payout-subnav-links a[data-section="builder"],
  .page-payout[data-payout-tab="cards"] .payout-subnav-links a[data-section="cards"],
  .page-payout-log .payout-subnav-links a[data-section="ladder_log"] {
    color: var(--accent, #d4af37);
    border-color: rgba(212,175,55,.35);
    background: rgba(212,175,55,.1);
  }
  .payout-subnav-tools {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-left: auto;
  }
  .payout-subnav-tools a {
    text-decoration: none;
    color: rgba(127,199,217,.95);
    font-size: 11px;
    letter-spacing: .04em;
    padding: 6px 10px;
    border-radius: 8px;
    border: 1px solid rgba(127,199,217,.28);
    background: rgba(127,199,217,.06);
  }
  .payout-subnav-tools a:hover { background: rgba(127,199,217,.12); }
  .payout-subnav-tools a.active,
  .page-payout-ladder .payout-subnav-tools a[data-section="ladder_table"] {
    color: #7fc7d9;
    border-color: rgba(127,199,217,.5);
    background: rgba(127,199,217,.14);
  }
  @media (max-width: 720px) {
    .payout-subnav-sep { display: none !important; }
    .payout-subnav-tools { margin-left: 0; width: 100%; }
  }
</style>
<nav class="payout-subnav" aria-label="Payouts sections">
  <a class="payout-subnav-back" href="/payout">&larr; Back to Builder</a>
  <span class="payout-subnav-sep" aria-hidden="true"></span>
  <div class="payout-subnav-links">
    <a href="/payout" data-section="builder">Builder</a>
    <a href="/payout/log" data-section="ladder_log">Ladder Log</a>
    <a href="/payout?tab=cards" data-section="cards">Rates &amp; Ladder</a>
  </div>
  <div class="payout-subnav-tools">
    <a href="/payout/ladder" data-section="ladder_table">Full table</a>
  </div>
</nav>
